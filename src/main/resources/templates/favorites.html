<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Избранное', ~{::section})}">
<section class="content-section" th:fragment="section">
    <h1>Избранное</h1>
    <div class="product-grid" th:if="${!#lists.isEmpty(items)}">
        <th:block th:each="product : ${items}">
            <div th:replace="~{fragments/product-card :: card(item=${product})}"></div>
        </th:block>
        <form th:each="product : ${items}" method="post" th:action="@{/buyer/favorites/remove/{id}(id=${product.id})}">
            <button class="btn btn-light" type="submit">Удалить из избранного</button>
        </form>
    </div>
    <p class="empty-state" th:if="${#lists.isEmpty(items)}">Список избранного пуст.</p>
</section>
</html>
