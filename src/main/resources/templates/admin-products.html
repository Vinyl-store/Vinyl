<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Товары', ~{::section})}">
<section class="content-section" th:fragment="section">
    <h1>Управление товарами</h1>
    <article class="card form-card">
        <h2>Создать товар</h2>
        <form method="post" th:action="@{/admin/products/create}" class="admin-form-grid">
            <select name="sellerId" required>
                <option th:each="seller : ${sellers}" th:value="${seller.id}"
                        th:text="${seller.firstName + ' ' + seller.lastName}">seller</option>
            </select>
            <input type="text" name="title" placeholder="Название" required>
            <input type="text" name="artist" placeholder="Исполнитель" required>
            <input type="text" name="genre" placeholder="Жанр">
            <input type="number" step="0.01" name="price" placeholder="Цена">
            <input type="number" name="releaseYear" placeholder="Год выпуска">
            <input type="number" name="stock" placeholder="Количество">
            <input type="text" name="coverUrl" placeholder="Ссылка на обложку">
            <textarea name="description" rows="4" placeholder="Описание"></textarea>
            <label><input type="checkbox" name="isPublished" checked> Опубликован</label>
            <label><input type="checkbox" name="isFeatured"> Подборка</label>
            <label><input type="checkbox" name="isSale"> Распродажа</label>
            <button class="btn" type="submit">Создать</button>
        </form>
    </article>
    <article class="card product-admin-card" th:each="product : ${productsRows}">
        <form method="post" th:action="@{/admin/products/{id}/update(id=${product.id})}" class="admin-form-grid">
            <input type="text" name="title" th:value="${product.title}" placeholder="Название">
            <input type="text" name="artist" th:value="${product.artist}" placeholder="Исполнитель">
            <input type="text" name="genre" th:value="${product.genre}" placeholder="Жанр">
            <input type="number" step="0.01" name="price" th:value="${product.price}" placeholder="Цена">
            <input type="number" name="releaseYear" th:value="${product.releaseYear}" placeholder="Год выпуска">
            <input type="number" name="stock" th:value="${product.stock}" placeholder="Количество">
            <input type="text" name="coverUrl" th:value="${product.coverUrl}" placeholder="Ссылка на обложку">
            <textarea name="description" rows="3" placeholder="Описание" th:text="${product.description}"></textarea>
            <label><input type="checkbox" name="isPublished" th:checked="${product.published}"> Опубликован</label>
            <label><input type="checkbox" name="isFeatured" th:checked="${product.featured}"> Подборка</label>
            <label><input type="checkbox" name="isSale" th:checked="${product.sale}"> Распродажа</label>
            <button class="btn btn-secondary" type="submit">Сохранить</button>
        </form>
        <form method="post" th:action="@{/admin/products/{id}/delete(id=${product.id})}">
            <button class="btn btn-light" type="submit">Удалить</button>
        </form>
    </article>
</section>
</html>
